name: Deploy to Lambda

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: lumina-backend
  API_FUNCTION: lumina-backend-api
  CRON_FUNCTION: lumina-backend-cron

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push API image
        id: build-api-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: api-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f backend/Dockerfile ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push cron image
        id: build-cron-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: cron-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f backend/Dockerfile.cron ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy API Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.API_FUNCTION }} \
            --image-uri ${{ steps.build-api-image.outputs.image }}
          aws lambda wait function-updated --function-name ${{ env.API_FUNCTION }}

      - name: Deploy cron Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.CRON_FUNCTION }} \
            --image-uri ${{ steps.build-cron-image.outputs.image }}
          aws lambda wait function-updated --function-name ${{ env.CRON_FUNCTION }}

      - name: Set up Node for smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Export Supabase credentials for smoke tests
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id arn:aws:secretsmanager:eu-west-2:179598271525:secret:lumina/app-secrets-gU1u8K \
            --query SecretString --output text)
          echo "SMOKE_SUPABASE_URL=$(echo "$SECRET" | jq -r '.SUPABASE_URL')" >> "$GITHUB_ENV"
          echo "SMOKE_SUPABASE_SERVICE_KEY=$(echo "$SECRET" | jq -r '.SUPABASE_SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Run smoke tests against production
        working-directory: frontend
        run: npx playwright test --config playwright.smoke.config.ts

      - name: Upload smoke test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: frontend/playwright-report/
          retention-days: 7
